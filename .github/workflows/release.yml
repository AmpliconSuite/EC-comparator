name: Test PyPI Release

on:
  release:
    types:
      - published

jobs:
  test-pypi-release:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Wait for package to become available on PyPI
        run: |
          for i in {1..12}; do
            if python -m pip index versions EC-comparator 2>/dev/null | grep -q "${{ github.event.release.tag_name#v }}"; then
              echo "EC-comparator version is available on PyPI."
              break
            fi

            echo "Waiting for PyPI..."
            sleep 30
          done

      - name: Install EC-comparator from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install EC-comparator

      - name: Check installed version
        run: |
          EC-comparator --version
          python -m pip show EC-comparator

      - name: Check CLI
        run: |
          EC-comparator --help